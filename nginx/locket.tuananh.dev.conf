# Nginx Reverse Proxy Configuration for locket.tuananh.dev
# Locket Pro Web Client (Docker Compose upstream on port 5000)

server {
    server_name locket.tuananh.dev;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header REMOTE-HOST $remote_addr;

        # Timeouts for large video encoding
        proxy_connect_timeout 90s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/locket.tuananh.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/locket.tuananh.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = locket.tuananh.dev) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name locket.tuananh.dev;
    return 404;
}