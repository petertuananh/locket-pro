# Nginx Reverse Proxy Configuration for locket.tuananh.dev
# Locket Pro Web Client (Docker Compose upstream on port 3000)

server {
    listen 80;
    listen [::]:80;
    server_name locket.tuananh.dev;

    # ACME Challenge verification directory for SSL Let's Encrypt / aaPanel
    location /.well-known/ {
        allow all;
        root /www/wwwroot/locket.tuananh.dev;
    }

    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name locket.tuananh.dev;

    # SSL Certificate
    ssl_certificate     /www/server/panel/vhost/cert/locket.tuananh.dev/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/locket.tuananh.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Upload size limit for 4K / HEVC video uploads up to 100MB
    client_max_body_size 120M;

    # Logs
    access_log /www/wwwlogs/locket.tuananh.dev.log;
    error_log  /www/wwwlogs/locket.tuananh.dev.error.log;

    # ACME Challenge verification directory
    location /.well-known/ {
        allow all;
        root /www/wwwroot/locket.tuananh.dev;
    }

    # Reverse proxy to Docker Compose app container (127.0.0.1:3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header REMOTE-HOST $remote_addr;

        # Timeouts for large video encoding
        proxy_connect_timeout 90s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}
